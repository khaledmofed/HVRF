services:
  - type: web
    name: hvrf
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: hvrf-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hvrf-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hvrf-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hvrf-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hvrf-db
          property: password
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: hvrf-db
    plan: free
    region: frankfurt
